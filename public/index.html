      w.target=target;w.leaving=leaving;w.moving=true;w.speed=leaving?150:fast?285+rand(w,75):!w.joined?(FAST_TEST?900:190+rand(w,50)):78+rand(w,38);w.flip=target.x<w.x?-1:1;w.el.style.setProperty("--flip",w.flip);setState(w,"walk")
    }
    function announcement(w){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,120,innerWidth-120)+"px";n.textContent=`🐾 ${w.name} JOINED THE PACK`;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function packHowl(joiner){
      playHowl();announcement(joiner);[...wolves.values()].filter(w=>!w.leaving).forEach((w,i)=>setTimeout(()=>{w.moving=false;w.target=null;w.zoomiesUntil=0;w.interaction=null;setState(w,"howl",2700);w.next=performance.now()+3300+rand(w,1200)},Math.min(i*70,420)))
    }
    function interactionTarget(w,targetKey,command){const normalized=s=>String(s||"").replace(/[^a-z0-9]/gi,"").toLowerCase(),others=[...wolves.values()].filter(x=>x!==w&&!x.leaving),target=targetKey?(wolves.get(targetKey)||others.find(x=>normalized(x.key)===normalized(targetKey))):others.sort((a,b)=>Math.abs(a.x-w.x)-Math.abs(b.x-w.x))[0];if(!target){findNotice(w,targetKey?`🐾 @${targetKey} DOES NOT HAVE A WOLF ON SCREEN`:`🐾 NO OTHER WOLF IS READY TO ${command.toUpperCase()}`,"#8a93a0");return null}return target}
    function startInteraction(w,type,targetKey){const target=interactionTarget(w,targetKey,type==="playwith"?"play":"boop");if(!target)return;target.moving=false;target.target=null;target.zoomiesUntil=0;setState(target,"idle",10000);w.interaction={type,targetKey:target.key};let side=w.x<=target.x?-88:88;if(type==="playwith"){const canUseLeft=target.x>=310,canUseRight=target.x<=innerWidth-555;side=canUseLeft||!canUseRight?-300:300}moveTo(w,{x:clamp(target.x+side,5,innerWidth-245),y:target.y},false,true)}
    function tugRope(w,target,duration){const left=w.x<target.x?w:target,right=left===w?target:w,x1=left.x+168,x2=right.x+70,rope=document.createElement("div");rope.className="tug-rope";rope.textContent="🪢━━━━━━━━🪢";rope.style.left=x1+"px";rope.style.bottom=(left.y+50)+"px";rope.style.width=Math.max(80,x2-x1)+"px";document.body.append(rope);setTimeout(()=>rope.remove(),duration)}
    function finishInteraction(w){const action=w.interaction;w.interaction=null;if(!action)return false;const target=wolves.get(action.targetKey);if(!target||target.leaving)return false;if(action.type==="boop"){setState(w,"react",2500);setState(target,"react",2500);findNotice(w,`🐽 ${w.name} BOOPED ${target.name}!`,"#ff8ba0");w.next=target.next=performance.now()+3300}else{const wLeft=w.x<target.x,left=wLeft?w:target,right=wLeft?target:w;w.flip=wLeft?1:-1;target.flip=wLeft?-1:1;w.el.style.setProperty("--flip",w.flip);target.el.style.setProperty("--flip",target.flip);setState(w,"tug",7000);setState(target,"tug",7000);left.el.classList.add("face-right");right.el.classList.add("face-left");tugRope(w,target,7000);findNotice(w,`🪢 ${w.name} AND ${target.name} ARE PLAYING TUG-OF-WAR!`,"#52f7d4");w.next=target.next=performance.now()+7800}return true}
    function runCommand(w,command,targetKey=""){
      if(!command||w.leaving)return;w.el.dataset.lastCommand=command;w.moving=false;w.target=null;w.zoomiesUntil=0;w.interaction=null;w.commandId=(w.commandId||0)+1;const id=w.commandId;w.el.querySelectorAll(".treat").forEach(x=>x.remove());
      if(command==="dig"){runDig(w);return}
      if(command==="stats"){showStats(w);return}
      if(command==="commands"){showCommands(w);return}
      if(command==="attack"){attackBoss(w);return}
      if(command==="treat"){feedTreat(w);return}
      if(command==="zoomies"){w.zoomiesUntil=performance.now()+8000;findNotice(w,`💨 ${w.name} HAS THE ZOOMIES!`,"#52f7d4");moveTo(w,zoomTargetFor(w),false,true);return}
      if(command==="boop"||command==="playwith"){startInteraction(w,command,targetKey);return}
      const durations={howl:4000,sit:10000,sleep:14000},duration=durations[command];
      if(command==="howl")playHowl();
      setState(w,command,duration);
      w.next=performance.now()+duration+900
    }
    function addTestWolves(count){for(let i=0;i<count;i++)setTimeout(()=>{testWolfNumber++;spawn({username:`TestWolf${testWolfNumber}`,avatar:location.origin+"/overlay/assets/wolf-idle.webp",message:""})},i*500)}
    function spawn(d){
      const name=String(d.username||"PackWolf").trim().slice(0,40),key=name.toLowerCase(),avatar=avatarOf(d),chatCommand=String(d.message||"").trim().toLowerCase().split(/\s+/)[0],parsed=commandOf(d.message),command=parsed.command,targetKey=parsed.targetKey,boardCommand=chatCommand==="!leaderboard"||chatCommand==="!top5";
      if(key===OWNER&&chatCommand==="!testwolf"){addTestWolves(1);return}if(key===OWNER&&chatCommand==="!testpack"){addTestWolves(5);return}if(key===OWNER&&chatCommand==="!testmoon"){const force=String(d.message||"").trim().toLowerCase().split(/\s+/)[1];triggerMoon({username:name,detail:"10 TEST KICKS",force});return}if(key===OWNER&&chatCommand==="!testboss"){startBoss({hp:180,duration:60000,test:true});if(!wolves.has(key))spawn({...d,message:"",skipXp:true});return}if(key===OWNER&&chatCommand==="!resetme"){const w=wolves.get(key);resetOwnerStats(w);if(!w)spawn({...d,message:"",skipXp:true});return}
      const xpResult=d.skipXp?{leveled:false,stats:profileStats(profileFor(key,name,avatar))}:awardXp(key,name,avatar,!!command||boardCommand);if(boardCommand)showLeaderboard();
      if(wolves.has(key)){const w=wolves.get(key);w.last=Date.now();if(avatar&&!w.avatar){w.avatar=avatar;const plate=w.el.querySelector(".nameplate");plate.classList.add("has-avatar");plate.insertAdjacentHTML("afterbegin",`<img class="avatar" src="${safe(avatar)}" alt="">`)}updateWolfRank(w);if(xpResult.leveled)levelAnnouncement(w,xpResult.stats);if(w.leaving){w.leaving=false;moveTo(w,targetFor(w));w.pendingCommand={command,targetKey}}else if(command)runCommand(w,command,targetKey);else if(!w.moving){setState(w,"react",800);w.next=performance.now()+1200}return}
      const h=hash(key),el=document.createElement("div"),fromLeft=(h&1)===0,scale=.82+((h>>>8)%18)/100;
      el.className="wolf walk";el.style.setProperty("--scale",scale);el.style.setProperty("--depth",1+((h>>>12)%5));el.style.setProperty("--fur-filter",palettes[h%palettes.length]);el.style.setProperty("--eye",eyes[(h>>>4)%eyes.length]);el.style.setProperty("--scar",(h>>>10)%4===0?.9:0);
      el.innerHTML=`<div class="nameplate${avatar?" has-avatar":""}">${avatar?`<img class="avatar" src="${safe(avatar)}" alt="">`:""}<span class="wolf-name"><span class="wolf-name-text">${safe(name)}</span><b class="moon-loot"></b></span><small class="wolf-meta"></small></div><div class="character"><div class="sprite"></div><i class="eye-glow"></i><i class="scar"></i></div><b class="cosmetic"></b>`;pack.append(el);
      const w={name,key,avatar,el,baseScale:scale,seed:h||7,x:fromLeft?-260:innerWidth+30,y:18+((h>>>16)%45),target:null,moving:false,leaving:false,flip:fromLeft?1:-1,state:"walk",until:0,next:0,last:Date.now(),joined:false,pendingCommand:{command,targetKey},commandId:0,zoomiesUntil:0,interaction:null};wolves.set(key,w);updateWolfRank(w);w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px";requestAnimationFrame(()=>el.classList.add("visible"));moveTo(w,targetFor(w))
    }
    function chooseAction(w,now){
      const r=rand(w);let state=r<.34?"idle":r<.52?"sit":r<.66?"sleep":r<.78?"scratch":r<.9?"play":"howl";
      const duration=state==="sleep"?6500+rand(w,5000):state==="idle"?2500+rand(w,3500):state==="howl"?2200:2200+rand(w,2000);setState(w,state,duration);w.next=now+duration+800+rand(w,2600)
    }
    function leave(w){w.leaving=true;const left=w.x<innerWidth/2;moveTo(w,{x:left?-290:innerWidth+60,y:w.y},true)}
    let last=performance.now(),lastLabelLayout=0;
    function layoutNameplates(){const laneRights=[];[...wolves.values()].filter(w=>!w.leaving).sort((a,b)=>a.x-b.x).forEach(w=>{const center=w.x+119,left=center-140,right=center+140;let lane=laneRights.findIndex(edge=>left>edge+14);if(lane<0)lane=laneRights.length;laneRights[lane]=right;w.el.style.setProperty("--label-lane",Math.min(lane,2))})}
    function frame(now){
      const dt=Math.min(.3,(now-last)/1000);last=now;
      for(const [key,w] of wolves){
        if(w.moving){
          const dx=w.target.x-w.x,dy=w.target.y-w.y,dist=Math.hypot(dx,dy),step=w.speed*dt;
          if(dist<=step+1){
            w.x=w.target.x;w.y=w.target.y;w.moving=false;
            if(w.leaving){w.el.remove();wolves.delete(key);continue}
            if(!w.joined){w.joined=true;packHowl(w);if(w.pendingCommand.command){const pending=w.pendingCommand;w.pendingCommand={command:"",targetKey:""};setTimeout(()=>runCommand(w,pending.command,pending.targetKey),2900)}}
            else if(w.interaction){finishInteraction(w)}
            else if(w.zoomiesUntil>now)moveTo(w,zoomTargetFor(w),false,true);
            else{w.zoomiesUntil=0;setState(w,"idle",1700);w.next=now+2200+rand(w,3200)}
          }else{w.x+=dx/dist*step;w.y+=dy/dist*step}
          w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px"
        }
        else if(w.until&&now>=w.until){setState(w,"idle");w.next=now+650+rand(w,1500)}
        else if(!w.until&&now>=w.next&&!w.leaving){if(rand(w)<.72)moveTo(w,targetFor(w));else chooseAction(w,now)}
        if(!w.leaving&&(!w.lootCheck||Date.now()>=w.lootCheck)){updateWolfRank(w);w.lootCheck=Date.now()+30000}
        if(!w.leaving&&Date.now()-w.last>TIMEOUT)leave(w)
      }
      if(now-lastLabelLayout>180){layoutNameplates();lastLabelLayout=now}requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame);
    function connect(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/live");ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==="chat")spawn(d);else if(d.type==="moon")triggerMoon(d);else if(d.type==="boss")startBoss(d);else if(d.type==="bossStop")finishBoss(false,true)}catch{}};ws.onclose=()=>setTimeout(connect,2200)}
    connect();
    updateLeaderboard();
    const query=new URLSearchParams(location.search);
    if(query.has("demo")){["DigTester","LESTARWOLF","NightFang","CyberHowl","RedMoon","PackRunner"].forEach((username,i)=>setTimeout(()=>spawn({username,message:i===5?"!leaderboard":""}),i*850))}
    if(query.has("v3test")){setTimeout(()=>spawn({username:"DigTester",message:"!zoomies"}),28000);setTimeout(()=>spawn({username:"CyberHowl",message:"!boop @NightFang"}),39000);setTimeout(()=>spawn({username:"LESTARWOLF",message:"!play @PackRunner"}),48000);setTimeout(()=>spawn({username:"RedMoon",message:"!howl"}),58000)}
    if(query.has("tugtest")){spawn({username:"LESTARWOLF",message:""});setTimeout(()=>spawn({username:"PackRunner",message:""}),300);setTimeout(()=>spawn({username:"LESTARWOLF",message:"!play @PackRunner"}),6500)}
    if(query.has("moon"))setTimeout(()=>triggerMoon({username:"DigTester",detail:"10 TEST KICKS",force:query.get("moon")}),5200);
    if(query.has("bosstest")){["DigTester","NightFang","CyberHowl","PackRunner"].forEach((username,i)=>setTimeout(()=>spawn({username,message:""}),i*260));setTimeout(()=>startBoss({hp:260,duration:90000,test:true}),1700);setTimeout(()=>spawn({username:"DigTester",message:"!attack"}),3300);setTimeout(()=>spawn({username:"NightFang",message:"!attack"}),3900);setTimeout(()=>spawn({username:"CyberHowl",message:"!attack"}),4500);setTimeout(()=>spawn({username:"PackRunner",message:"!attack"}),5100)}
    addEventListener("resize",()=>{for(const w of wolves.values())if(!w.leaving){w.x=clamp(w.x,-40,innerWidth-205);w.el.style.left=w.x+"px"}});
  </script>
</body>

<html lang="en">
<head>

  <title>LESTARWOLF Live Pack V3</title>
  <style>
    :root{--pack-floor:22px;--wolf-w:238px;--wolf-h:170px}

    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}

    .find-fx{position:absolute;left:48%;bottom:17px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px #000);z-index:9;animation:findPop 3.2s ease-out forwards}.cosmetic{position:absolute;left:54%;top:37px;z-index:7;font-size:25px;line-height:1;filter:drop-shadow(0 2px 3px #000);animation:cosmeticFloat 2.4s ease-in-out infinite}
    .eye-glow{position:absolute;right:46px;top:51px;width:6px;height:6px;border-radius:50%;background:var(--eye,#e31b2d);box-shadow:0 0 7px 2px var(--eye,#e31b2d);opacity:.75;transform:scaleX(var(--flip));display:none}
    .idle .eye-glow,.react .eye-glow{display:block}
    .scar{position:absolute;right:49px;top:43px;width:2px;height:20px;background:#cdd5daaa;box-shadow:4px 1px 0 #cdd5da66;transform:rotate(19deg) scaleX(var(--flip));opacity:var(--scar,0);border-radius:2px}
    .nameplate{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:max-content;max-width:218px;min-width:105px;min-height:38px;padding:4px 12px 4px 30px;border:1px solid var(--rank-glow,#eb2238);border-radius:17px;background:linear-gradient(180deg,#111720f5,#050609f5);color:#fff;font-size:13px;font-weight:900;letter-spacing:.25px;white-space:nowrap;overflow:hidden;text-align:center;text-shadow:0 1px 3px #000;box-shadow:0 0 0 1px #000,0 3px 12px #000b,0 0 var(--rank-shine,12px) color-mix(in srgb,var(--rank-glow,#b70e22) 60%,transparent)}
    .nameplate:before{content:"";position:absolute;left:10px;top:12px;width:9px;height:9px;background:var(--rank-glow,var(--eye,#e31b2d));transform:rotate(45deg);box-shadow:0 0 7px var(--rank-glow,var(--eye,#e31b2d))}
    .nameplate.has-avatar{padding-left:39px}.nameplate.has-avatar:before{display:none}.wolf-name{display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden}.wolf-name-text{min-width:0;overflow:hidden;text-overflow:ellipsis}.wolf-meta{display:block;margin-top:-1px;color:#d8dde3;font-size:9px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}.avatar{position:absolute;left:4px;top:4px;width:29px;height:29px;border-radius:50%;object-fit:cover;background:#111;border:1px solid var(--rank-glow,#f02a3f);box-shadow:0 0 8px var(--rank-glow,#d51d35)}
    .join{position:absolute;bottom:205px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:14px;background:#06080be8;border:1px solid #e42036;color:#fff;font-size:14px;font-weight:1000;letter-spacing:.55px;white-space:nowrap;text-shadow:0 2px 4px #000;box-shadow:0 5px 18px #000a,0 0 18px #c9183066;animation:join 3s forwards;z-index:999}
    .leaderboard{position:absolute;left:15px;top:14px;width:270px;padding:9px 11px 8px;border:1px solid #df2035;border-radius:12px;background:linear-gradient(145deg,#11151dea,#050608e8);color:#fff;box-shadow:0 8px 24px #000a,0 0 18px #b6112755;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s;z-index:1000}.leaderboard.show{opacity:1;transform:none}.board-title{margin-bottom:7px;color:#fff;font-size:12px;font-weight:1000;letter-spacing:1.1px;text-align:center}.board-title b{color:#ef233c}.board-row{display:grid;grid-template-columns:18px 28px minmax(0,1fr) 38px;align-items:center;gap:6px;min-height:34px;border-top:1px solid #ffffff12;font-size:11px}.board-place{color:#f1243d;font-weight:1000;text-align:center}.board-avatar{width:24px;height:24px;border:1px solid #d92238;border-radius:50%;object-fit:cover;background:#161a20}.board-avatar.blank{display:grid;place-items:center;font-size:12px}.board-who{display:block;min-width:0}.board-name{display:block;overflow:hidden;color:#fff;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.board-rank{display:block;overflow:hidden;margin-top:1px;color:#aeb6c0;font-size:9px;font-weight:800;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}.board-level{color:#ffcf58;font-size:10px;font-weight:1000;text-align:right}
    #moonEvent{--moon-glow:#fff;position:absolute;left:16px;top:18px;width:212px;min-height:213px;opacity:0;transform:translateX(-270px);pointer-events:none;transition:opacity .45s ease,transform .75s cubic-bezier(.2,.85,.28,1);z-index:1100}#moonEvent.show{opacity:1;transform:translateX(0)}.moon-disc{position:relative;width:176px;height:176px;margin:auto;overflow:hidden;border:4px solid #ee2c43;border-radius:50%;background:#090a0e;box-shadow:0 0 0 3px #000b,inset -22px -20px 34px #0008,0 0 26px 6px var(--moon-glow),0 0 48px #e41e36aa}.moon-texture{position:absolute;inset:-2px;background:url("assets/moon-crater.webp") center/cover no-repeat;filter:brightness(1.18) contrast(1.12);transform:scale(1.04)}.moon-disc:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff55;border-radius:50%;box-shadow:inset 8px 7px 18px #fff3}.moon-white{--moon-glow:#effaff}.moon-white .moon-texture{filter:brightness(1.55) contrast(1.05)}.moon-green{--moon-glow:#39ef88}.moon-green .moon-texture{filter:sepia(1) saturate(7) hue-rotate(92deg) brightness(1.08) contrast(1.08)}.moon-blue{--moon-glow:#43adff}.moon-blue .moon-texture{filter:sepia(1) saturate(6) hue-rotate(170deg) brightness(1.1) contrast(1.08)}.moon-purple{--moon-glow:#b55cff}.moon-purple .moon-texture{filter:sepia(1) saturate(6) hue-rotate(232deg) brightness(1.08) contrast(1.08)}.moon-gold{--moon-glow:#ffd25a}.moon-gold .moon-texture{filter:sepia(1) saturate(6) hue-rotate(5deg) brightness(1.18) contrast(1.08)}.moon-copy{margin-top:5px;padding:5px 9px;border:1px solid #e42a40;border-radius:9px;background:#050609e8;color:#fff;text-align:center;text-shadow:0 2px 3px #000;box-shadow:0 4px 14px #000b}.moon-copy strong{display:block;font-size:12px;letter-spacing:1px}.moon-copy span{display:block;overflow:hidden;color:#d7dde3;font-size:10px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.moon-loot{display:inline-block;flex:0 0 auto;max-width:52px;overflow:hidden;color:#fff;font-size:12px;letter-spacing:-3px;line-height:1;filter:drop-shadow(0 1px 2px #000);white-space:nowrap}.moon-drop{position:fixed;left:104px;top:145px;z-index:1200;font-size:38px;line-height:1;filter:drop-shadow(0 3px 4px #000);animation:moonDrop 1.75s cubic-bezier(.25,.75,.36,1) forwards}@keyframes moonDrop{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(-18deg)}15%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(var(--drop-x),var(--drop-y)) scale(.72) rotate(32deg)}}
    @keyframes walkFrames{to{background-position-x:133.333%}}
    @keyframes walkBody{to{transform:translateY(-3px) rotate(-.5deg)}}
    @keyframes howlPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-1deg);filter:brightness(1.1)}}
    @keyframes breathe{50%{transform:scale(1.015,.985) translateY(2px)}}
    @keyframes scratch{to{transform:rotate(-1.6deg) translateX(-2px)}}
    @keyframes dig{to{transform:rotate(-2.4deg) translate(-3px,2px)}}
    @keyframes pounce{to{transform:translateY(-8px) rotate(-1deg)}}
    @keyframes perk{to{transform:translateY(-7px) scale(1.025)}}
    @keyframes chew{to{transform:translateY(2px) rotate(1deg)}}
    @keyframes treatToss{0%{transform:translate(0,0) rotate(-25deg) scale(1);opacity:1}55%{transform:translate(92px,-78px) rotate(18deg) scale(.82);opacity:1}100%{transform:translate(168px,-62px) rotate(42deg) scale(.25);opacity:0}}
    @keyframes findPop{0%{transform:translate(-50%,18px) scale(.25) rotate(-18deg);opacity:0}22%,70%{transform:translate(-50%,-35px) scale(1.2) rotate(8deg);opacity:1}100%{transform:translate(-50%,-58px) scale(.75);opacity:0}}@keyframes cosmeticFloat{50%{transform:translateY(-3px) rotate(4deg)}}
    @keyframes join{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}14%,72%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.96)}}
  </style>

<body>
  <div id="pack"></div><section id="moonEvent" class="moon-white"><div class="moon-disc"><i class="moon-texture"></i></div><div class="moon-copy"><strong id="moonResult">MOON ROLL</strong><span id="moonBy">A pack gift awakened the moon</span></div></section><aside id="leaderboard" class="leaderboard"><div class="board-title">TOP 5 <b>PACK MEMBERS</b></div><div id="boardRows"></div></aside>
  <script>
    const pack=document.getElementById("pack"),wolves=new Map(),moon=document.getElementById("moonEvent"),moonResult=document.getElementById("moonResult"),moonBy=document.getElementById("moonBy"),howlAudio=new Audio("assets/lestarwolf-howl.ogg"),TIMEOUT=15*60*1000,XP_COOLDOWN=60*1000,DIG_COOLDOWN=10*60*1000,BOARD_DURATION=15*1000,OWNER="lestarwolf",STORE_KEY="lestarwolf-pack-progress-v1",RANKS=["Newborn Pup","Pack Pup","Trail Scout","Night Hunter","Pack Guardian","Moon Warrior","Alpha Wolf","Cyber Pack Legend"],RANK_LEVELS=[1,3,6,10,15,21,28,36],RANK_COLORS=["#e7243b","#ed5b35","#f09b34","#ffcf58","#80d6ff","#9d83ff","#ff477e","#52f7d4"],MOON_COLORS=[{id:"white",label:"WHITE MOON",weight:43},{id:"green",label:"GREEN MOON",weight:27},{id:"blue",label:"BLUE MOON",weight:17},{id:"purple",label:"PURPLE MOON",weight:10},{id:"gold",label:"GOLD MOON",weight:3}],MOON_LOOT={white:{icon:"🪶",name:"Moon Feather",hours:24},green:{icon:"🍀",name:"Verdant Moon Charm",hours:24},blue:{icon:"💎",name:"Azure Moon Crystal",hours:42},purple:{icon:"🔮",name:"Void Moon Orb",hours:42},gold:{icon:"🏆",name:"Eternal Gold Moon Totem",hours:0}},DIG_LOOT=[{id:"bone",upto:34,icon:"🦴",label:"FOUND A BONE",xp:8},{id:"steak",upto:54,icon:"🥩",label:"FOUND A GIANT STEAK",xp:15},{id:"boot",upto:74,icon:"🥾",label:"DUG UP AN OLD BOOT... GROSS",xp:0},{id:"duck",upto:86,icon:"🦆",label:"FOUND A SQUEAKY DUCK",xp:5},{id:"skunk",upto:94,icon:"🦨",label:"FOUND A SKUNK — RUN",xp:0,run:true},{id:"nothing",upto:99,icon:"❓",label:"FOUND... ABSOLUTELY NOTHING",xp:0},{id:"golden",upto:99.8,icon:"🏅",label:"FOUND THE GOLDEN BONE",xp:50,cosmetic:"🏅",cosmeticName:"Golden Collar",tier:2},{id:"crown",upto:100,icon:"👑",label:"FOUND THE MOON CROWN",xp:100,cosmetic:"👑",cosmeticName:"Moon Crown",tier:3}];let testWolfNumber=0,boardTimer=0,moonRunning=false,moonQueue=[];howlAudio.preload="auto";
    let progress={};try{progress=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{};const resetKey="lestarwolf-owner-reset-v3";if(localStorage.getItem(resetKey)!=="done"){delete progress[OWNER];localStorage.setItem(STORE_KEY,JSON.stringify(progress));localStorage.setItem(resetKey,"done")}}catch{progress={}}
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
    const safe=s=>String(s||"").replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"})[c]);
    const avatarOf=d=>{const raw=typeof d.avatar==="string"?d.avatar:d.avatar&&typeof d.avatar.url==="string"?d.avatar.url:"";try{const u=new URL(raw);return u.protocol==="https:"?u.href:""}catch{return""}};
    function commandOf(message){const parts=String(message||"").trim().split(/\s+/),raw=(parts.shift()||"").toLowerCase(),command=({"!howl":"howl","!sit":"sit","!sleep":"sleep","!treat":"treat","!dig":"dig","!zoomies":"zoomies","!boop":"boop","!play":"playwith","!stats":"stats","!commands":"commands"})[raw]||"",mention=parts.find(x=>x.startsWith("@"))||"",targetKey=mention.slice(1).replace(/[^a-z0-9_.-]/gi,"").toLowerCase();return{command,targetKey}}
    const rand=(w,n=1)=>{w.seed=(Math.imul(w.seed,1664525)+1013904223)>>>0;return(w.seed/4294967296)*n};
    const weightedMoon=forced=>{const valid=MOON_COLORS.find(x=>x.id===forced);if(valid)return valid;let roll=Math.random()*100;for(const color of MOON_COLORS){roll-=color.weight;if(roll<0)return color}return MOON_COLORS[0]};
    function cleanMoonLoot(p){const now=Date.now(),before=(p.moonLoots||[]).length;p.moonLoots=(p.moonLoots||[]).filter(x=>!x.expiresAt||x.expiresAt>now);if(before!==p.moonLoots.length)saveProgress();return p.moonLoots}
    function awardMoonLoot(event,color){if(!event.username||/^(anonymous|pack member)/i.test(event.username))return null;const loot=MOON_LOOT[color.id],key=String(event.username).toLowerCase(),p=profileFor(key,event.username,event.avatar||"");p.moonLoots=Array.isArray(p.moonLoots)?p.moonLoots:[];cleanMoonLoot(p);const item={id:`${color.id}-${Date.now()}`,icon:loot.icon,name:loot.name,expiresAt:loot.hours?Date.now()+loot.hours*60*60*1000:0};p.moonLoots.push(item);const permanent=p.moonLoots.filter(x=>!x.expiresAt),temporary=p.moonLoots.filter(x=>x.expiresAt).slice(-Math.max(0,8-permanent.length));p.moonLoots=[...permanent,...temporary];saveProgress();const w=wolves.get(key);if(w)updateWolfRank(w);return item}
    function dropMoonLoot(item,event){if(!item)return;const w=wolves.get(String(event.username||"").toLowerCase()),drop=document.createElement("b"),x=w?clamp(w.x+110,45,innerWidth-45):110,y=w?Math.max(180,innerHeight-w.y-110):440;drop.className="moon-drop";drop.textContent=item.icon;drop.style.setProperty("--drop-x",x-104+"px");drop.style.setProperty("--drop-y",y-145+"px");document.body.append(drop);setTimeout(()=>drop.remove(),1800)}
    function playHowl(){try{const sound=howlAudio.cloneNode();sound.volume=.82;sound.play().catch(()=>{});setTimeout(()=>{sound.pause();sound.removeAttribute("src")},4100)}catch{}}
    function moonPackHowl(){for(const w of wolves.values())if(!w.leaving){w.moving=false;setState(w,"howl",2800);w.next=performance.now()+3400}playHowl()}
    function setMoonColor(color){moon.className=`moon-${color.id} show`;moonResult.textContent=color.label}
    function triggerMoon(event={}){if(moonRunning){moonQueue.push(event);return}moonRunning=true;moonPackHowl();const landing=weightedMoon(event.force),detail=event.detail||"A PACK GIFT AWAKENED THE MOON";moonBy.textContent=event.username?`${event.username} · ${detail}`:detail;moonResult.textContent="MOON ROLL";moon.className="moon-white show";let step=0;const spin=()=>{const final=step===29,selected=final?landing:MOON_COLORS[Math.floor(Math.random()*MOON_COLORS.length)];setMoonColor(selected);if(final){const item=awardMoonLoot(event,selected);dropMoonLoot(item,event);moonBy.textContent=`${detail} · ${item?`${item.name.toUpperCase()} DROPPED`:"LANDED ON"} ${selected.label}`;setTimeout(()=>{moon.className="moon-white";moonRunning=false;const next=moonQueue.shift();if(next)setTimeout(()=>triggerMoon(next),700)},6000);return}const delay=220+step*46;step++;setTimeout(spin,delay)};spin()}
    const palettes=[
      "brightness(.84) contrast(1.2) saturate(1.1)","brightness(.98) contrast(1.08) saturate(.82)","sepia(.18) hue-rotate(330deg) brightness(.92)",
      "hue-rotate(8deg) saturate(1.28) contrast(1.12)","grayscale(.24) brightness(1.05) contrast(1.08)","hue-rotate(345deg) saturate(.9) brightness(.88)",
      "sepia(.28) saturate(.78) brightness(.88)","hue-rotate(18deg) saturate(1.05) contrast(1.16)"
    ],eyes=["#ed1832","#ff7b22","#62c8ff","#d9f5ff","#a449ff","#ffd25a"];
    const levelOf=xp=>Math.floor(Math.sqrt(Math.max(0,xp)/25))+1;
    const rankIndexOf=level=>{let rank=0;for(let i=1;i<RANK_LEVELS.length;i++)if(level>=RANK_LEVELS[i])rank=i;return rank};
    const profileFor=(key,name,avatar)=>{const p=progress[key]||{name,xp:0,lastXp:0,lastDig:0,avatar:"",inventory:{},cosmetic:"",cosmeticName:"",cosmeticTier:0,moonLoots:[]};p.name=name||p.name;p.avatar=avatar||p.avatar||"";p.xp=Number(p.xp)||0;p.lastXp=Number(p.lastXp)||0;p.lastDig=Number(p.lastDig)||0;p.inventory=p.inventory&&typeof p.inventory==="object"?p.inventory:{};p.cosmetic=String(p.cosmetic||"");p.cosmeticName=String(p.cosmeticName||"");p.cosmeticTier=Number(p.cosmeticTier)||0;p.moonLoots=Array.isArray(p.moonLoots)?p.moonLoots:[];const removedDuck=p.cosmetic==="🦆"||p.cosmeticName==="Duck Charm";if(removedDuck){p.cosmetic="";p.cosmeticName="";p.cosmeticTier=0}progress[key]=p;if(removedDuck)saveProgress();return p};
    function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(progress))}catch{}}
    function profileStats(p){const level=levelOf(p.xp),rank=rankIndexOf(level);return{level,rank,title:RANKS[rank],color:RANK_COLORS[rank]}}
    function updateLeaderboard(){const rows=document.getElementById("boardRows"),top=Object.entries(progress).filter(([key,p])=>key!==OWNER&&!key.startsWith("testwolf")&&p&&p.name).sort((a,b)=>(b[1].xp||0)-(a[1].xp||0)||(a[1].name||"").localeCompare(b[1].name||"")).slice(0,5);rows.innerHTML=top.map(([key,p],i)=>{const s=profileStats(p),pic=avatarOf({avatar:p.avatar});return`<div class="board-row"><span class="board-place">${i+1}</span>${pic?`<img class="board-avatar" src="${safe(pic)}" alt="">`:`<span class="board-avatar blank">🐺</span>`}<span class="board-who"><span class="board-name">${safe(p.name)}</span><span class="board-rank">${safe(s.title)} · ${p.xp} XP</span></span><span class="board-level">LV ${s.level}</span></div>`}).join("")}
    function showLeaderboard(){const board=document.getElementById("leaderboard");updateLeaderboard();if(!document.querySelector(".board-row")||boardTimer)return;board.classList.add("show");boardTimer=setTimeout(()=>{board.classList.remove("show");boardTimer=0},BOARD_DURATION)}
    function updateWolfRank(w){const p=profileFor(w.key,w.name,w.avatar),s=profileStats(p),base=w.baseScale||1,moonLoots=cleanMoonLoot(p),lootIcons=moonLoots.slice(-3).map(x=>x.icon).join("");w.el.style.setProperty("--scale",(base+s.rank*.018).toFixed(3));w.el.style.setProperty("--rank-glow",s.color);w.el.style.setProperty("--rank-shine",12+s.rank*3+"px");w.el.dataset.rank=s.rank;w.el.dataset.xp=p.xp;w.el.dataset.lastDig=p.lastDig;const meta=w.el.querySelector(".wolf-meta"),cosmetic=w.el.querySelector(".cosmetic"),moonLoot=w.el.querySelector(".moon-loot");if(meta)meta.textContent=`LV ${s.level} · ${s.title}`;if(cosmetic){cosmetic.textContent=p.cosmetic;cosmetic.title=p.cosmeticName}if(moonLoot){moonLoot.textContent=lootIcons;moonLoot.title=moonLoots.map(x=>x.name).join(" · ")}}
    function levelAnnouncement(w,stats){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,130,innerWidth-130)+"px";n.style.borderColor=stats.color;n.textContent=`🌙 ${w.name} REACHED LEVEL ${stats.level} — ${stats.title}`;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function awardXp(key,name,avatar,isCommand=false){if(key.startsWith("testwolf"))return{leveled:false};const p=profileFor(key,name,avatar),before=levelOf(p.xp),now=Date.now();if(now-p.lastXp<XP_COOLDOWN){if(avatar&&!p.avatar){p.avatar=avatar;saveProgress();updateLeaderboard()}return{leveled:false,stats:profileStats(p)}}p.xp+=5+(isCommand?3:0);p.lastXp=now;saveProgress();updateLeaderboard();const stats=profileStats(p);return{leveled:stats.level>before,stats}}
    function findNotice(w,text,color="#e42036"){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,150,innerWidth-150)+"px";n.style.borderColor=color;n.textContent=text;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function resetOwnerStats(w){delete progress[OWNER];saveProgress();updateLeaderboard();if(w){updateWolfRank(w);findNotice(w,"♻️ LESTARWOLF'S LEVEL, ITEMS, AND COOLDOWNS WERE RESET","#52f7d4")}}
    function showStats(w){const p=profileFor(w.key,w.name,w.avatar),s=profileStats(p),loot=cleanMoonLoot(p).length,finds=Object.values(p.inventory).reduce((a,b)=>a+(Number(b)||0),0);findNotice(w,`🐺 ${w.name} · LV ${s.level} · ${p.xp} XP · ${finds} DIG FINDS · ${loot} MOON ITEM${loot===1?"":"S"}`,s.color)}
    function showCommands(w){findNotice(w,"🐾 !HOWL !SIT !SLEEP !TREAT !DIG !ZOOMIES !BOOP @NAME !PLAY @NAME !STATS","#52f7d4")}
    function runDig(w){const p=profileFor(w.key,w.name,w.avatar),now=Date.now(),remaining=w.key===OWNER?0:DIG_COOLDOWN-(now-p.lastDig);if(remaining>0){setState(w,"react",1500);const wait=remaining<60000?Math.ceil(remaining/1000)+" SECONDS":Math.ceil(remaining/60000)+" MINUTES";findNotice(w,`🕒 ${w.name} CAN DIG AGAIN IN ${wait}`,"#8a93a0");w.next=performance.now()+2200;return}p.lastDig=now;const roll=rand(w,100),loot=DIG_LOOT.find(x=>roll<x.upto)||DIG_LOOT[DIG_LOOT.length-1],before=levelOf(p.xp),upgraded=!!loot.cosmetic&&((loot.tier||0)>p.cosmeticTier||!p.cosmetic);p.inventory[loot.id]=(Number(p.inventory[loot.id])||0)+1;p.xp+=loot.xp;if(upgraded){p.cosmetic=loot.cosmetic;p.cosmeticName=loot.cosmeticName;p.cosmeticTier=loot.tier||0}saveProgress();updateLeaderboard();updateWolfRank(w);setState(w,"dig",4300);const fx=document.createElement("b");fx.className="find-fx";fx.textContent=loot.icon;w.el.append(fx);setTimeout(()=>fx.remove(),3300);const reward=loot.xp?` +${loot.xp} XP`:"",unlock=upgraded?` · ${loot.cosmeticName.toUpperCase()} UNLOCKED`:"";setTimeout(()=>findNotice(w,`${loot.icon} ${w.name} ${loot.label}${reward}${unlock}`,loot.cosmetic?"#ffcf58":"#e42036"),650);const stats=profileStats(p);if(stats.level>before)setTimeout(()=>levelAnnouncement(w,stats),3600);if(loot.run){const id=w.commandId;setTimeout(()=>{if(w.commandId===id&&!w.leaving)moveTo(w,targetFor(w))},3300)}w.next=performance.now()+5200}
    function setState(w,state,ms=0){w.state=state;w.el.className=`wolf visible ${state}${state==="walk"&&w.leaving?" leaving":""}`;w.until=ms?performance.now()+ms:0}
    function targetFor(w){
      const edge=innerWidth<700?6:24,max=Math.max(edge,innerWidth-250),cols=Math.max(2,Math.floor((max-edge)/195)+1),rows=wolves.size>cols?2:1,slots=[];
      for(let row=0;row<rows;row++)for(let i=0;i<cols;i++){const x=cols===1?edge:edge+(max-edge)*i/(cols-1),y=20+row*82;let nearest=99999;for(const o of wolves.values())if(o!==w){const ox=o.target&&!o.leaving?o.target.x:o.x,oy=o.target&&!o.leaving?o.target.y:o.y;nearest=Math.min(nearest,Math.hypot(ox-x,(oy-y)*2.2))}slots.push({x:x+rand(w,10)-5,y:y+rand(w,7)-3.5,nearest})}
      const travel=slots.filter(s=>Math.hypot(s.x-w.x,(s.y-w.y)*2)>175),pool=travel.length?travel:slots;
      pool.sort((a,b)=>b.nearest-a.nearest);return pool[Math.floor(rand(w,Math.min(3,pool.length)))]
    }
    function zoomTargetFor(w){return{x:12+rand(w,Math.max(20,innerWidth-274)),y:18+rand(w,Math.max(25,innerHeight-235))}}
    function moveTo(w,target,leaving=false,fast=false){
      w.target=target;w.leaving=leaving;w.moving=true;w.speed=leaving?150:fast?285+rand(w,75):!w.joined?190+rand(w,50):78+rand(w,38);w.flip=target.x<w.x?-1:1;w.el.style.setProperty("--flip",w.flip);setState(w,"walk")
    }
    function announcement(w){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,120,innerWidth-120)+"px";n.textContent=`🐾 ${w.name} JOINED THE PACK`;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function packHowl(joiner){
      playHowl();announcement(joiner);[...wolves.values()].filter(w=>!w.leaving).forEach((w,i)=>setTimeout(()=>{w.moving=false;w.target=null;w.zoomiesUntil=0;w.interaction=null;setState(w,"howl",2700);w.next=performance.now()+3300+rand(w,1200)},Math.min(i*70,420)))
    }
    function interactionTarget(w,targetKey,command){const target=targetKey&&wolves.get(targetKey);if(!targetKey){findNotice(w,`🐾 USE !${command} @VIEWER`,"#8a93a0");return null}if(!target||target.leaving){findNotice(w,`🐾 @${targetKey} DOES NOT HAVE A WOLF ON SCREEN`,"#8a93a0");return null}if(target===w){findNotice(w,"🐺 PICK ANOTHER PACK MEMBER","#8a93a0");return null}return target}
    function startInteraction(w,type,targetKey){const target=interactionTarget(w,targetKey,type==="playwith"?"play":"boop");if(!target)return;target.moving=false;target.target=null;target.zoomiesUntil=0;setState(target,"idle",3200);w.interaction={type,targetKey};const side=w.x<=target.x?-88:88;moveTo(w,{x:clamp(target.x+side,5,innerWidth-245),y:target.y},false,true)}
    function finishInteraction(w){const action=w.interaction;w.interaction=null;if(!action)return false;const target=wolves.get(action.targetKey);if(!target||target.leaving)return false;if(action.type==="boop"){setState(w,"react",2500);setState(target,"react",2500);findNotice(w,`🐽 ${w.name} BOOPED ${target.name}!`,"#ff8ba0");w.next=target.next=performance.now()+3300}else{setState(w,"play",6500);setState(target,"play",6500);findNotice(w,`🐾 ${w.name} AND ${target.name} ARE WRESTLING!`,"#52f7d4");w.next=target.next=performance.now()+7300}return true}
    function runCommand(w,command,targetKey=""){
      if(!command||w.leaving)return;w.moving=false;w.target=null;w.zoomiesUntil=0;w.interaction=null;w.commandId=(w.commandId||0)+1;const id=w.commandId;w.el.querySelectorAll(".treat").forEach(x=>x.remove());
      if(command==="dig"){runDig(w);return}
      if(command==="stats"){showStats(w);return}
      if(command==="commands"){showCommands(w);return}
      if(command==="zoomies"){w.zoomiesUntil=performance.now()+8000;findNotice(w,`💨 ${w.name} HAS THE ZOOMIES!`,"#52f7d4");moveTo(w,zoomTargetFor(w),false,true);return}
      if(command==="boop"||command==="playwith"){startInteraction(w,command,targetKey);return}
      const durations={howl:4000,sit:10000,sleep:14000,treat:5200},duration=durations[command];
      if(command==="howl")playHowl();
      if(command==="treat"){setState(w,"treating",duration);const bone=document.createElement("b");bone.className="treat";bone.textContent="🦴";w.el.querySelector(".character").append(bone);setTimeout(()=>{if(w.commandId===id)bone.remove()},1900)}else setState(w,command,duration);
      w.next=performance.now()+duration+900
    }
    function addTestWolves(count){for(let i=0;i<count;i++)setTimeout(()=>{testWolfNumber++;spawn({username:`TestWolf${testWolfNumber}`,avatar:location.origin+"/overlay/assets/wolf-idle.webp",message:""})},i*500)}
    function spawn(d){
      const name=String(d.username||"PackWolf").trim().slice(0,40),key=name.toLowerCase(),avatar=avatarOf(d),chatCommand=String(d.message||"").trim().toLowerCase().split(/\s+/)[0],parsed=commandOf(d.message),command=parsed.command,targetKey=parsed.targetKey,boardCommand=chatCommand==="!leaderboard"||chatCommand==="!top5";
      if(key===OWNER&&chatCommand==="!testwolf"){addTestWolves(1);return}if(key===OWNER&&chatCommand==="!testpack"){addTestWolves(5);return}if(key===OWNER&&chatCommand==="!testmoon"){const force=String(d.message||"").trim().toLowerCase().split(/\s+/)[1];triggerMoon({username:name,detail:"10 TEST KICKS",force});return}if(key===OWNER&&chatCommand==="!resetme"){const w=wolves.get(key);resetOwnerStats(w);if(!w)spawn({...d,message:"",skipXp:true});return}
      const xpResult=d.skipXp?{leveled:false,stats:profileStats(profileFor(key,name,avatar))}:awardXp(key,name,avatar,!!command||boardCommand);if(boardCommand)showLeaderboard();
      if(wolves.has(key)){const w=wolves.get(key);w.last=Date.now();if(avatar&&!w.avatar){w.avatar=avatar;const plate=w.el.querySelector(".nameplate");plate.classList.add("has-avatar");plate.insertAdjacentHTML("afterbegin",`<img class="avatar" src="${safe(avatar)}" alt="">`)}updateWolfRank(w);if(xpResult.leveled)levelAnnouncement(w,xpResult.stats);if(w.leaving){w.leaving=false;moveTo(w,targetFor(w));w.pendingCommand={command,targetKey}}else if(command)runCommand(w,command,targetKey);else if(!w.moving){setState(w,"react",800);w.next=performance.now()+1200}return}
      const h=hash(key),el=document.createElement("div"),fromLeft=(h&1)===0,scale=.82+((h>>>8)%18)/100;
      el.className="wolf walk";el.style.setProperty("--scale",scale);el.style.setProperty("--depth",1+((h>>>12)%5));el.style.setProperty("--fur-filter",palettes[h%palettes.length]);el.style.setProperty("--eye",eyes[(h>>>4)%eyes.length]);el.style.setProperty("--scar",(h>>>10)%4===0?.9:0);
      el.innerHTML=`<div class="nameplate${avatar?" has-avatar":""}">${avatar?`<img class="avatar" src="${safe(avatar)}" alt="">`:""}<span class="wolf-name"><span class="wolf-name-text">${safe(name)}</span><b class="moon-loot"></b></span><small class="wolf-meta"></small></div><div class="character"><div class="sprite"></div><i class="eye-glow"></i><i class="scar"></i></div><b class="cosmetic"></b>`;pack.append(el);
      const w={name,key,avatar,el,baseScale:scale,seed:h||7,x:fromLeft?-260:innerWidth+30,y:18+((h>>>16)%45),target:null,moving:false,leaving:false,flip:fromLeft?1:-1,state:"walk",until:0,next:0,last:Date.now(),joined:false,pendingCommand:{command,targetKey},commandId:0,zoomiesUntil:0,interaction:null};wolves.set(key,w);updateWolfRank(w);w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px";requestAnimationFrame(()=>el.classList.add("visible"));moveTo(w,targetFor(w))
    }
    function chooseAction(w,now){
      const r=rand(w);let state=r<.34?"idle":r<.52?"sit":r<.66?"sleep":r<.78?"scratch":r<.9?"play":"howl";
      const duration=state==="sleep"?6500+rand(w,5000):state==="idle"?2500+rand(w,3500):state==="howl"?2200:2200+rand(w,2000);setState(w,state,duration);w.next=now+duration+800+rand(w,2600)
    }
    function leave(w){w.leaving=true;const left=w.x<innerWidth/2;moveTo(w,{x:left?-290:innerWidth+60,y:w.y},true)}
    let last=performance.now();
    function frame(now){
      const dt=Math.min(.3,(now-last)/1000);last=now;
      for(const [key,w] of wolves){
        if(w.moving){
          const dx=w.target.x-w.x,dy=w.target.y-w.y,dist=Math.hypot(dx,dy),step=w.speed*dt;
          if(dist<=step+1){
            w.x=w.target.x;w.y=w.target.y;w.moving=false;
            if(w.leaving){w.el.remove();wolves.delete(key);continue}
            if(!w.joined){w.joined=true;packHowl(w);if(w.pendingCommand.command){const pending=w.pendingCommand;w.pendingCommand={command:"",targetKey:""};setTimeout(()=>runCommand(w,pending.command,pending.targetKey),2900)}}
            else if(w.interaction){finishInteraction(w)}
            else if(w.zoomiesUntil>now)moveTo(w,zoomTargetFor(w),false,true);
            else{w.zoomiesUntil=0;setState(w,"idle",1700);w.next=now+2200+rand(w,3200)}
          }else{w.x+=dx/dist*step;w.y+=dy/dist*step}
          w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px"
        }
        else if(w.until&&now>=w.until){setState(w,"idle");w.next=now+650+rand(w,1500)}
        else if(!w.until&&now>=w.next&&!w.leaving){if(rand(w)<.72)moveTo(w,targetFor(w));else chooseAction(w,now)}
        if(!w.leaving&&(!w.lootCheck||Date.now()>=w.lootCheck)){updateWolfRank(w);w.lootCheck=Date.now()+30000}
        if(!w.leaving&&Date.now()-w.last>TIMEOUT)leave(w)
      }
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame);
    function connect(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/live");ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==="chat")spawn(d);else if(d.type==="moon")triggerMoon(d)}catch{}};ws.onclose=()=>setTimeout(connect,2200)}
    connect();
    updateLeaderboard();
    const query=new URLSearchParams(location.search);
    if(query.has("demo")){["DigTester","LESTARWOLF","NightFang","CyberHowl","RedMoon","PackRunner"].forEach((username,i)=>setTimeout(()=>spawn({username,message:i===0?"!dig":i===5?"!leaderboard":""}),i*850))}
    if(query.has("v3test")){setTimeout(()=>spawn({username:"DigTester",message:"!zoomies"}),9000);setTimeout(()=>spawn({username:"CyberHowl",message:"!boop @NightFang"}),18000);setTimeout(()=>spawn({username:"LESTARWOLF",message:"!play @PackRunner"}),24000);setTimeout(()=>spawn({username:"RedMoon",message:"!howl"}),32000)}
    if(query.has("moon"))setTimeout(()=>triggerMoon({username:"DigTester",detail:"10 TEST KICKS",force:query.get("moon")}),5200);
    addEventListener("resize",()=>{for(const w of wolves.values())if(!w.leaving){w.x=clamp(w.x,-40,innerWidth-205);w.el.style.left=w.x+"px"}});
  </script>

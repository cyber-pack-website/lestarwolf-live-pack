<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial}.wolf{--fur:#30343a;--light:#c3c7c9;--dark:#171a1e;--eye:#ff2638;position:absolute;bottom:24px;width:210px;height:160px;opacity:0;transition:left 4.6s linear,bottom 2.5s ease,opacity .6s;filter:drop-shadow(0 8px 5px #0009);transform:scaleX(var(--flip,1));transform-origin:center}.wolf.on{opacity:1}.name{position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%) scaleX(var(--flip,1));padding:4px 10px;border-radius:8px;background:#080a0de8;border:1px solid #d22130;color:#fff;font-size:13px;font-weight:900;white-space:nowrap;text-shadow:0 1px 3px #000}.wolf .render{position:absolute;left:18px;top:22px;width:175px;height:138px;object-fit:contain;filter:drop-shadow(0 7px 5px #000b) hue-rotate(var(--hue,0deg)) saturate(var(--sat,1));transform-origin:center}.walk .render{animation:bob .42s infinite alternate}.howl .render{animation:howlimg 1s 2}.sit .render{transform:translateY(12px) scaleY(.93)}.sleep .render{transform:translateY(35px) rotate(90deg) scale(.9)}.scratch .render{animation:scratchimg .22s 10 alternate}.shake .render{animation:shake .11s 14 alternate}.play .render{animation:play .48s 5 alternate}.body,.neck,.head,.muzzle,.tail,.leg{transform-box:fill-box;transform-origin:center}.tail{transform-origin:left center;animation:wag 1.15s ease-in-out infinite alternate}.walk .body{animation:bob .42s infinite alternate}.walk .leg.fl,.walk .leg.br{animation:step .42s infinite alternate}.walk .leg.fr,.walk .leg.bl{animation:step .42s infinite alternate-reverse}.howl .head{animation:howl 1s 2;transform-origin:70% 80%}.sit .body{transform:translateY(7px) rotate(4deg)}.sit .leg.bl,.sit .leg.br{transform:rotate(-38deg) translateY(8px)}.sleep svg{transform:translateY(27px) scaleY(.76)}.sleep .head{transform:translate(-18px,22px) rotate(10deg)}.scratch .head{animation:scratch .22s 10 alternate}.scratch .leg.fl{animation:scratchleg .22s 10 alternate}.shake svg{animation:shake .11s 14 alternate}.play svg{animation:play .48s 5 alternate}.leaving{opacity:0!important;transition:left 3s linear,opacity .7s 2.2s!important}.notice{position:absolute;bottom:190px;color:#fff;font:bold 14px Arial;text-shadow:0 2px 5px #000,0 0 9px #d22;animation:notice 2.7s forwards}@keyframes wag{to{transform:rotate(18deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes step{to{transform:rotate(17deg)}}@keyframes howl{50%{transform:rotate(-32deg) translateY(-10px)}}@keyframes scratch{to{transform:rotate(7deg)}}@keyframes scratchleg{to{transform:rotate(-58deg)}}@keyframes shake{to{transform:translateX(4px) rotate(1deg)}}@keyframes play{to{transform:translateY(-13px) rotate(-2deg)}}@keyframes howlimg{50%{transform:rotate(-16deg) translateY(-9px)}}@keyframes scratchimg{to{transform:rotate(6deg)}}@keyframes notice{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}</style></head><body><div id="p"></div><script>
const P=document.getElementById("p"),M=new Map();function H(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}const esc=s=>String(s||"").replace(/[<>&"]/g,"");function art(h){const wolves=["https://pngimg.com/uploads/wolf/wolf_PNG23206.png","https://pngimg.com/uploads/wolf/wolf_PNG23197.png","https://pngimg.com/uploads/wolf/wolf_PNG23194.png","https://pngimg.com/uploads/wolf/wolf_PNG23208.png","https://pngimg.com/uploads/wolf/wolf_PNG23189.png"];return '<img class="render" alt="" src="'+wolves[h%wolves.length]+'">'} 
function roam(q){if(!q||q.busy)return;q.busy=true;let e=q.e,x=20+Math.random()*Math.max(30,innerWidth-245),y=18+Math.random()*58,old=parseFloat(e.style.left)||0;e.classList.remove("sit","sleep","scratch","shake","play","howl");e.classList.add("walk");e.style.setProperty("--flip",x<old?-1:1);e.style.left=x+"px";e.style.bottom=y+"px";setTimeout(()=>{e.classList.remove("walk");q.busy=false},4700)}function howl(){M.forEach(q=>{q.e.classList.remove("sit","sleep","scratch","shake","play");q.e.classList.add("howl");setTimeout(()=>q.e.classList.remove("howl"),2100)})}
function add(d){let k=d.username.toLowerCase();if(M.has(k)){let q=M.get(k);q.last=Date.now();q.e.classList.remove("sleep","sit");if(!q.busy&&Math.random()<.7)roam(q);return}let h=H(k),F=["#20252a","#33383d","#4b4642","#171b20","#555c62","#382f2b","#697177"],L=["#d0d2cf","#b8c0c3","#ded6c9","#938a82","#eef0ec"],D=["#101317","#17191c","#211c1b"],e=document.createElement("div");e.className="wolf walk";e.style.setProperty("--fur",F[h%F.length]);e.style.setProperty("--light",L[(h>>4)%L.length]);e.style.setProperty("--dark",D[(h>>8)%D.length]);e.style.setProperty("--hue",((h>>10)%5)*10+"deg");e.style.setProperty("--sat",(.9+((h>>14)%4)*.12));e.style.setProperty("--flip",h%2?1:-1);e.style.left=(h%2?-230:innerWidth+20)+"px";e.innerHTML='<div class="name">'+esc(d.username)+'</div>'+art(h);P.appendChild(e);let q={e,last:Date.now(),h,busy:true};M.set(k,q);requestAnimationFrame(()=>{e.classList.add("on");e.style.left=(30+Math.random()*Math.max(30,innerWidth-260))+"px"});setTimeout(()=>{e.classList.remove("walk");q.busy=false;howl();let n=document.createElement("div");n.className="notice";n.style.left=e.style.left;n.textContent="🐾 "+d.username+" JOINED THE PACK!";P.appendChild(n);setTimeout(()=>n.remove(),2800)},4800)}
const acts=["sit","sleep","scratch","shake","play"];setInterval(()=>{let free=[...M.values()].filter(q=>!q.busy&&!q.e.classList.contains("howl"));if(free.length&&Math.random()<.72)roam(free[Math.floor(Math.random()*free.length)]);let a=[...M.values()].filter(q=>!q.busy&&!q.e.classList.contains("howl"));if(a.length&&Math.random()<.8){let q=a[Math.floor(Math.random()*a.length)],act=acts[Math.floor(Math.random()*acts.length)];q.e.classList.remove(...acts);q.e.classList.add(act);setTimeout(()=>q.e.classList.remove(act),act==="sleep"?7000:3000)}},6500);setInterval(()=>{let t=Date.now();M.forEach((q,k)=>{if(t-q.last>900000&&!q.e.classList.contains("leaving")){q.busy=true;q.e.classList.remove(...acts);q.e.classList.add("walk","leaving");q.e.style.setProperty("--flip",1);q.e.style.left=(innerWidth+250)+"px";setTimeout(()=>{q.e.remove();M.delete(k)},3200)}})},15000);function conn(){let w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/live");w.onmessage=x=>{try{let d=JSON.parse(x.data);if(d.type==="chat")add(d)}catch{}};w.onclose=()=>setTimeout(conn,2000)}conn();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial}.wolf{--a:#444;--b:#aaa;position:absolute;bottom:18px;width:125px;height:110px;opacity:0;transition:left 1.1s,opacity .7s;filter:drop-shadow(0 7px 4px #0008)}.wolf.on{opacity:1}.body{position:absolute;left:38px;top:44px;width:66px;height:39px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--a))}.head{position:absolute;left:14px;top:24px;width:50px;height:44px;border-radius:50%;background:var(--a)}.ear{position:absolute;top:-13px;width:18px;height:24px;background:var(--a);clip-path:polygon(50% 0,100% 100%,0 85%)}.e1{left:5px}.e2{right:4px}.muzzle{position:absolute;left:-12px;top:27px;width:30px;height:17px;border-radius:50%;background:var(--b)}.eye{position:absolute;left:9px;top:18px;width:6px;height:5px;border-radius:50%;background:#ed3342}.tail{position:absolute;left:96px;top:49px;width:37px;height:15px;border-radius:50%;background:var(--a);transform-origin:left;animation:wag .7s infinite alternate}.leg{position:absolute;top:73px;width:11px;height:31px;border-radius:8px;background:var(--a)}.l1{left:42px}.l2{left:60px}.l3{left:87px}.l4{left:100px}.name{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:3px 8px;border-radius:9px;background:#090b0ddd;border:1px solid #b5222d;color:white;font-size:12px;font-weight:900;white-space:nowrap}.avatar{position:absolute;right:1px;top:4px;width:27px;height:27px;border-radius:50%;object-fit:cover;border:2px solid #b5222d}.howl .head{animation:howl .8s 2}.fun{animation:hop .55s 3}.notice{position:absolute;bottom:140px;color:white;font:bold 14px Arial;text-shadow:0 2px 5px #000,0 0 8px #d22;animation:notice 2.5s forwards}@keyframes wag{to{rotate:-28deg}}@keyframes howl{50%{transform:rotate(-25deg) translateY(-7px)}}@keyframes hop{50%{translate:0 -14px}}@keyframes notice{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0;translate:0 -20px}}</style></head><body><div id="p"></div><script>
const P=document.getElementById("p"),M=new Map();function H(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function layout(){let a=[...M.values()],w=innerWidth-135;a.forEach((q,i)=>q.e.style.left=(a.length===1?innerWidth/2-62:10+w*i/Math.max(1,a.length-1))+"px")}function howl(){M.forEach(q=>{q.e.classList.add("howl");setTimeout(()=>q.e.classList.remove("howl"),1800)})}function add(d){let k=d.username.toLowerCase();if(M.has(k)){M.get(k).last=Date.now();return}let h=H(k),A=["#343a40","#555b60","#756b62","#24282c","#616b70"],B=["#b8b8b2","#d0c8bc","#9ca7ab"],e=document.createElement("div");e.className="wolf";e.style.setProperty("--a",A[h%A.length]);e.style.setProperty("--b",B[(h>>4)%B.length]);let safe=d.username.replace(/[<>&"]/g,"");e.innerHTML='<div class="name">'+safe+'</div>'+(d.avatar?'<img class="avatar" src="'+d.avatar.replace(/"/g,"")+'">':'')+'<div class="body"></div><div class="tail"></div><div class="head"><i class="ear e1"></i><i class="ear e2"></i><i class="eye"></i><i class="muzzle"></i></div><i class="leg l1"></i><i class="leg l2"></i><i class="leg l3"></i><i class="leg l4"></i>';P.appendChild(e);M.set(k,{e,last:Date.now()});layout();requestAnimationFrame(()=>e.classList.add("on"));setTimeout(()=>{howl();let n=document.createElement("div");n.className="notice";n.style.left=e.style.left;n.textContent="🐾 "+d.username+" JOINED THE PACK!";P.appendChild(n);setTimeout(()=>n.remove(),2600)},900)}
setInterval(()=>{let a=[...M.values()];if(a.length){let q=a[Math.floor(Math.random()*a.length)];q.e.classList.add("fun");setTimeout(()=>q.e.classList.remove("fun"),1800)}},5500);setInterval(()=>{let t=Date.now();M.forEach((q,k)=>{if(t-q.last>900000){q.e.style.opacity=0;setTimeout(()=>{q.e.remove();M.delete(k);layout()},800)}})},30000);addEventListener("resize",layout);function conn(){let w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/live");w.onmessage=x=>{try{let d=JSON.parse(x.data);if(d.type==="chat")add(d)}catch{}};w.onclose=()=>setTimeout(conn,2000)}conn();

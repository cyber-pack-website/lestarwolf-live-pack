<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LESTARWOLF Live Pack V2</title>
  <style>
    :root{--pack-floor:22px;--wolf-w:238px;--wolf-h:170px}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
    #pack{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .wolf{--flip:1;--scale:1;--fur-filter:none;position:absolute;width:var(--wolf-w);height:var(--wolf-h);left:-280px;bottom:var(--pack-floor);opacity:0;will-change:transform,left,bottom,opacity;transform:translate3d(0,0,0) scale(var(--scale));transform-origin:50% 100%;filter:drop-shadow(0 8px 5px #000a);transition:opacity .45s ease,filter .25s ease;z-index:var(--depth,1)}
    .wolf.visible{opacity:1}
    .wolf.leaving{opacity:.82}
    .character{position:absolute;inset:0;transform:scaleX(var(--flip));transform-origin:50% 76%;transition:transform .18s ease}
    .sprite{position:absolute;inset:0;background-repeat:no-repeat;filter:var(--fur-filter);will-change:background-position,transform}
    .walk .sprite{background-image:url("assets/wolf-walk.webp");background-size:400% 100%;animation:walkFrames .68s steps(4) infinite,walkBody .34s ease-in-out infinite alternate}
    .idle .sprite,.howl .sprite,.sit .sprite,.sleep .sprite,.scratch .sprite,.play .sprite,.react .sprite,.treating .sprite{background-size:100% 100%}
    .idle .sprite,.react .sprite,.treating .sprite{background-image:url("assets/wolf-idle.webp")}
    .howl .sprite{background-image:url("assets/wolf-howl.webp");animation:howlPulse 1.3s ease-in-out infinite}
    .sit .sprite{background-image:url("assets/wolf-sit.webp")}
    .sleep .sprite{background-image:url("assets/wolf-sleep.webp");animation:breathe 2.8s ease-in-out infinite}
    .scratch .sprite{background-image:url("assets/wolf-scratch.webp");animation:scratch .2s ease-in-out infinite alternate}
    .play .sprite{background-image:url("assets/wolf-play.webp");animation:pounce .48s ease-in-out infinite alternate}
    .treating .sprite{animation:chew .22s ease-in-out 1.65s 9 alternate}
    .react .sprite{animation:perk .35s ease-out 2 alternate}
    .treat{position:absolute;left:12px;bottom:8px;font-size:28px;line-height:1;filter:drop-shadow(0 2px 3px #000);z-index:8;animation:treatToss 1.75s ease-in forwards}
    .eye-glow{position:absolute;right:46px;top:51px;width:6px;height:6px;border-radius:50%;background:var(--eye,#e31b2d);box-shadow:0 0 7px 2px var(--eye,#e31b2d);opacity:.75;transform:scaleX(var(--flip));display:none}
    .idle .eye-glow,.react .eye-glow{display:block}
    .scar{position:absolute;right:49px;top:43px;width:2px;height:20px;background:#cdd5daaa;box-shadow:4px 1px 0 #cdd5da66;transform:rotate(19deg) scaleX(var(--flip));opacity:var(--scar,0);border-radius:2px}
    .nameplate{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:max-content;max-width:218px;min-width:105px;min-height:38px;padding:4px 12px 4px 30px;border:1px solid var(--rank-glow,#eb2238);border-radius:17px;background:linear-gradient(180deg,#111720f5,#050609f5);color:#fff;font-size:13px;font-weight:900;letter-spacing:.25px;white-space:nowrap;overflow:hidden;text-align:center;text-shadow:0 1px 3px #000;box-shadow:0 0 0 1px #000,0 3px 12px #000b,0 0 var(--rank-shine,12px) color-mix(in srgb,var(--rank-glow,#b70e22) 60%,transparent)}
    .nameplate:before{content:"";position:absolute;left:10px;top:12px;width:9px;height:9px;background:var(--rank-glow,var(--eye,#e31b2d));transform:rotate(45deg);box-shadow:0 0 7px var(--rank-glow,var(--eye,#e31b2d))}
    .nameplate.has-avatar{padding-left:39px}.nameplate.has-avatar:before{display:none}.wolf-name{display:block;overflow:hidden;text-overflow:ellipsis}.wolf-meta{display:block;margin-top:-1px;color:#d8dde3;font-size:9px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}.avatar{position:absolute;left:4px;top:4px;width:29px;height:29px;border-radius:50%;object-fit:cover;background:#111;border:1px solid var(--rank-glow,#f02a3f);box-shadow:0 0 8px var(--rank-glow,#d51d35)}
    .join{position:absolute;bottom:205px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:14px;background:#06080be8;border:1px solid #e42036;color:#fff;font-size:14px;font-weight:1000;letter-spacing:.55px;white-space:nowrap;text-shadow:0 2px 4px #000;box-shadow:0 5px 18px #000a,0 0 18px #c9183066;animation:join 3s forwards;z-index:999}
    .leaderboard{position:absolute;left:15px;top:14px;width:270px;padding:9px 11px 8px;border:1px solid #df2035;border-radius:12px;background:linear-gradient(145deg,#11151dea,#050608e8);color:#fff;box-shadow:0 8px 24px #000a,0 0 18px #b6112755;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s;z-index:1000}.leaderboard.show{opacity:1;transform:none}.board-title{margin-bottom:7px;color:#fff;font-size:12px;font-weight:1000;letter-spacing:1.1px;text-align:center}.board-title b{color:#ef233c}.board-row{display:grid;grid-template-columns:18px 28px minmax(0,1fr) 38px;align-items:center;gap:6px;min-height:34px;border-top:1px solid #ffffff12;font-size:11px}.board-place{color:#f1243d;font-weight:1000;text-align:center}.board-avatar{width:24px;height:24px;border:1px solid #d92238;border-radius:50%;object-fit:cover;background:#161a20}.board-avatar.blank{display:grid;place-items:center;font-size:12px}.board-who{display:block;min-width:0}.board-name{display:block;overflow:hidden;color:#fff;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.board-rank{display:block;overflow:hidden;margin-top:1px;color:#aeb6c0;font-size:9px;font-weight:800;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}.board-level{color:#ffcf58;font-size:10px;font-weight:1000;text-align:right}.status{position:absolute;right:14px;top:12px;padding:5px 9px;border-radius:8px;background:#080a0dbb;color:#aeb5bc;font:700 11px Arial;opacity:0;transition:opacity .2s}.demo .status{opacity:1}
    @keyframes walkFrames{to{background-position-x:133.333%}}
    @keyframes walkBody{to{transform:translateY(-3px) rotate(-.5deg)}}
    @keyframes howlPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-1deg);filter:brightness(1.1)}}
    @keyframes breathe{50%{transform:scale(1.015,.985) translateY(2px)}}
    @keyframes scratch{to{transform:rotate(-1.6deg) translateX(-2px)}}
    @keyframes pounce{to{transform:translateY(-8px) rotate(-1deg)}}
    @keyframes perk{to{transform:translateY(-7px) scale(1.025)}}
    @keyframes chew{to{transform:translateY(2px) rotate(1deg)}}
    @keyframes treatToss{0%{transform:translate(0,0) rotate(-25deg) scale(1);opacity:1}55%{transform:translate(92px,-78px) rotate(18deg) scale(.82);opacity:1}100%{transform:translate(168px,-62px) rotate(42deg) scale(.25);opacity:0}}
    @keyframes join{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}14%,72%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.96)}}
  </style>
</head>
<body>
  <div id="pack"></div><aside id="leaderboard" class="leaderboard"><div class="board-title">TOP 5 <b>PACK MEMBERS</b></div><div id="boardRows"></div></aside><div id="status" class="status">V2 PACK ONLINE</div>
  <script>
    const pack=document.getElementById("pack"),wolves=new Map(),TIMEOUT=15*60*1000,XP_COOLDOWN=60*1000,BOARD_DURATION=15*1000,OWNER="lestarwolf",STORE_KEY="lestarwolf-pack-progress-v1",RANKS=["Newborn Pup","Pack Pup","Trail Scout","Night Hunter","Pack Guardian","Moon Warrior","Alpha Wolf","Cyber Pack Legend"],RANK_LEVELS=[1,3,6,10,15,21,28,36],RANK_COLORS=["#e7243b","#ed5b35","#f09b34","#ffcf58","#80d6ff","#9d83ff","#ff477e","#52f7d4"];let testWolfNumber=0,boardTimer=0;
    let progress={};try{progress=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{}}catch{progress={}}
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
    const safe=s=>String(s||"").replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"})[c]);
    const avatarOf=d=>{const raw=typeof d.avatar==="string"?d.avatar:d.avatar&&typeof d.avatar.url==="string"?d.avatar.url:"";try{const u=new URL(raw);return u.protocol==="https:"?u.href:""}catch{return""}};
    const commandOf=message=>({"!howl":"howl","!sit":"sit","!sleep":"sleep","!treat":"treat"})[String(message||"").trim().toLowerCase().split(/\s+/)[0]]||"";
    const rand=(w,n=1)=>{w.seed=(Math.imul(w.seed,1664525)+1013904223)>>>0;return(w.seed/4294967296)*n};
    const palettes=[
      "brightness(.84) contrast(1.2) saturate(1.1)","brightness(.98) contrast(1.08) saturate(.82)","sepia(.18) hue-rotate(330deg) brightness(.92)",
      "hue-rotate(8deg) saturate(1.28) contrast(1.12)","grayscale(.24) brightness(1.05) contrast(1.08)","hue-rotate(345deg) saturate(.9) brightness(.88)",
      "sepia(.28) saturate(.78) brightness(.88)","hue-rotate(18deg) saturate(1.05) contrast(1.16)"
    ],eyes=["#ed1832","#ff7b22","#62c8ff","#d9f5ff","#a449ff","#ffd25a"];
    const levelOf=xp=>Math.floor(Math.sqrt(Math.max(0,xp)/25))+1;
    const rankIndexOf=level=>{let rank=0;for(let i=1;i<RANK_LEVELS.length;i++)if(level>=RANK_LEVELS[i])rank=i;return rank};
    const profileFor=(key,name,avatar)=>{const p=progress[key]||{name,xp:0,lastXp:0,avatar:""};p.name=name||p.name;p.avatar=avatar||p.avatar||"";p.xp=Number(p.xp)||0;p.lastXp=Number(p.lastXp)||0;progress[key]=p;return p};
    function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(progress))}catch{}}
    function profileStats(p){const level=levelOf(p.xp),rank=rankIndexOf(level);return{level,rank,title:RANKS[rank],color:RANK_COLORS[rank]}}
    function updateLeaderboard(){const rows=document.getElementById("boardRows"),top=Object.entries(progress).filter(([key,p])=>!key.startsWith("testwolf")&&p&&p.name).sort((a,b)=>(b[1].xp||0)-(a[1].xp||0)||(a[1].name||"").localeCompare(b[1].name||"")).slice(0,5);rows.innerHTML=top.map(([key,p],i)=>{const s=profileStats(p),pic=avatarOf({avatar:p.avatar});return`<div class="board-row"><span class="board-place">${i+1}</span>${pic?`<img class="board-avatar" src="${safe(pic)}" alt="">`:`<span class="board-avatar blank">🐺</span>`}<span class="board-who"><span class="board-name">${safe(p.name)}</span><span class="board-rank">${safe(s.title)} · ${p.xp} XP</span></span><span class="board-level">LV ${s.level}</span></div>`}).join("")}
    function showLeaderboard(){const board=document.getElementById("leaderboard");updateLeaderboard();if(!document.querySelector(".board-row")||boardTimer)return;board.classList.add("show");boardTimer=setTimeout(()=>{board.classList.remove("show");boardTimer=0},BOARD_DURATION)}
    function updateWolfRank(w){const p=profileFor(w.key,w.name,w.avatar),s=profileStats(p),base=w.baseScale||1;w.el.style.setProperty("--scale",(base+s.rank*.018).toFixed(3));w.el.style.setProperty("--rank-glow",s.color);w.el.style.setProperty("--rank-shine",12+s.rank*3+"px");w.el.dataset.rank=s.rank;const meta=w.el.querySelector(".wolf-meta");if(meta)meta.textContent=`LV ${s.level} · ${s.title}`}
    function levelAnnouncement(w,stats){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,130,innerWidth-130)+"px";n.style.borderColor=stats.color;n.textContent=`🌙 ${w.name} REACHED LEVEL ${stats.level} — ${stats.title}`;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function awardXp(key,name,avatar,isCommand=false){if(key.startsWith("testwolf"))return{leveled:false};const p=profileFor(key,name,avatar),before=levelOf(p.xp),now=Date.now();if(now-p.lastXp<XP_COOLDOWN){if(avatar&&!p.avatar){p.avatar=avatar;saveProgress();updateLeaderboard()}return{leveled:false,stats:profileStats(p)}}p.xp+=5+(isCommand?3:0);p.lastXp=now;saveProgress();updateLeaderboard();const stats=profileStats(p);return{leveled:stats.level>before,stats}}
    function setState(w,state,ms=0){w.state=state;w.el.className=`wolf visible ${state}${state==="walk"&&w.leaving?" leaving":""}`;w.until=ms?performance.now()+ms:0}
    function targetFor(w){
      const edge=innerWidth<700?6:24,max=Math.max(edge,innerWidth-250),cols=Math.max(2,Math.floor((max-edge)/195)+1),rows=wolves.size>cols?2:1,slots=[];
      for(let row=0;row<rows;row++)for(let i=0;i<cols;i++){const x=cols===1?edge:edge+(max-edge)*i/(cols-1),y=20+row*82;let nearest=99999;for(const o of wolves.values())if(o!==w){const ox=o.target&&!o.leaving?o.target.x:o.x,oy=o.target&&!o.leaving?o.target.y:o.y;nearest=Math.min(nearest,Math.hypot(ox-x,(oy-y)*2.2))}slots.push({x:x+rand(w,10)-5,y:y+rand(w,7)-3.5,nearest})}
      const travel=slots.filter(s=>Math.hypot(s.x-w.x,(s.y-w.y)*2)>175),pool=travel.length?travel:slots;
      pool.sort((a,b)=>b.nearest-a.nearest);return pool[Math.floor(rand(w,Math.min(3,pool.length)))]
    }
    function moveTo(w,target,leaving=false){
      w.target=target;w.leaving=leaving;w.moving=true;w.speed=leaving?150:!w.joined?190+rand(w,50):78+rand(w,38);w.flip=target.x<w.x?-1:1;w.el.style.setProperty("--flip",w.flip);setState(w,"walk")
    }
    function announcement(w){const n=document.createElement("div");n.className="join";n.style.left=clamp(w.x+119,120,innerWidth-120)+"px";n.textContent=`🐾 ${w.name} JOINED THE PACK`;pack.append(n);setTimeout(()=>n.remove(),3100)}
    function packHowl(joiner){
      setState(joiner,"howl",2700);announcement(joiner);let nearby=[...wolves.values()].filter(w=>w!==joiner&&!w.leaving).sort((a,b)=>Math.abs(a.x-joiner.x)-Math.abs(b.x-joiner.x)).slice(0,3);
      nearby.forEach((w,i)=>setTimeout(()=>{w.moving=false;setState(w,"howl",1900);w.next=performance.now()+2600+rand(w,2200)},220+i*160))
    }
    function runCommand(w,command){
      if(!command||w.leaving)return;w.moving=false;w.target=null;w.commandId=(w.commandId||0)+1;const id=w.commandId;w.el.querySelectorAll(".treat").forEach(x=>x.remove());
      const durations={howl:4000,sit:10000,sleep:14000,treat:5200},duration=durations[command];
      if(command==="treat"){setState(w,"treating",duration);const bone=document.createElement("b");bone.className="treat";bone.textContent="🦴";w.el.querySelector(".character").append(bone);setTimeout(()=>{if(w.commandId===id)bone.remove()},1900)}else setState(w,command,duration);
      w.next=performance.now()+duration+900
    }
    function addTestWolves(count){for(let i=0;i<count;i++)setTimeout(()=>{testWolfNumber++;spawn({username:`TestWolf${testWolfNumber}`,avatar:location.origin+"/overlay/assets/wolf-idle.webp",message:""})},i*500)}
    function spawn(d){
      const name=String(d.username||"PackWolf").trim().slice(0,40),key=name.toLowerCase(),avatar=avatarOf(d),chatCommand=String(d.message||"").trim().toLowerCase().split(/\s+/)[0],command=commandOf(d.message),boardCommand=chatCommand==="!leaderboard"||chatCommand==="!top5";
      if(key===OWNER&&chatCommand==="!testwolf"){addTestWolves(1);return}if(key===OWNER&&chatCommand==="!testpack"){addTestWolves(5);return}
      const xpResult=awardXp(key,name,avatar,!!command||boardCommand);if(boardCommand)showLeaderboard();
      if(wolves.has(key)){const w=wolves.get(key);w.last=Date.now();if(avatar&&!w.avatar){w.avatar=avatar;const plate=w.el.querySelector(".nameplate");plate.classList.add("has-avatar");plate.insertAdjacentHTML("afterbegin",`<img class="avatar" src="${safe(avatar)}" alt="">`)}updateWolfRank(w);if(xpResult.leveled)levelAnnouncement(w,xpResult.stats);if(w.leaving){w.leaving=false;moveTo(w,targetFor(w));w.pendingCommand=command}else if(command)runCommand(w,command);else if(!w.moving){setState(w,"react",800);w.next=performance.now()+1200}return}
      const h=hash(key),el=document.createElement("div"),fromLeft=(h&1)===0,scale=.82+((h>>>8)%18)/100;
      el.className="wolf walk";el.style.setProperty("--scale",scale);el.style.setProperty("--depth",1+((h>>>12)%5));el.style.setProperty("--fur-filter",palettes[h%palettes.length]);el.style.setProperty("--eye",eyes[(h>>>4)%eyes.length]);el.style.setProperty("--scar",(h>>>10)%4===0?.9:0);
      el.innerHTML=`<div class="nameplate${avatar?" has-avatar":""}">${avatar?`<img class="avatar" src="${safe(avatar)}" alt="">`:""}<span class="wolf-name">${safe(name)}</span><small class="wolf-meta"></small></div><div class="character"><div class="sprite"></div><i class="eye-glow"></i><i class="scar"></i></div>`;pack.append(el);
      const w={name,key,avatar,el,baseScale:scale,seed:h||7,x:fromLeft?-260:innerWidth+30,y:18+((h>>>16)%45),target:null,moving:false,leaving:false,flip:fromLeft?1:-1,state:"walk",until:0,next:0,last:Date.now(),joined:false,pendingCommand:command,commandId:0};wolves.set(key,w);updateWolfRank(w);w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px";requestAnimationFrame(()=>el.classList.add("visible"));moveTo(w,targetFor(w))
    }
    function chooseAction(w,now){
      const r=rand(w);let state=r<.34?"idle":r<.52?"sit":r<.66?"sleep":r<.78?"scratch":r<.9?"play":"howl";
      const duration=state==="sleep"?6500+rand(w,5000):state==="idle"?2500+rand(w,3500):state==="howl"?2200:2200+rand(w,2000);setState(w,state,duration);w.next=now+duration+800+rand(w,2600)
    }
    function leave(w){w.leaving=true;const left=w.x<innerWidth/2;moveTo(w,{x:left?-290:innerWidth+60,y:w.y},true)}
    let last=performance.now();
    function frame(now){
      const dt=Math.min(.3,(now-last)/1000);last=now;
      for(const [key,w] of wolves){
        if(w.moving){const dx=w.target.x-w.x,dy=w.target.y-w.y,dist=Math.hypot(dx,dy),step=w.speed*dt;if(dist<=step+1){w.x=w.target.x;w.y=w.target.y;w.moving=false;if(w.leaving){w.el.remove();wolves.delete(key);continue}if(!w.joined){w.joined=true;packHowl(w);if(w.pendingCommand){const pending=w.pendingCommand;w.pendingCommand="";setTimeout(()=>runCommand(w,pending),2900)}}else{setState(w,"idle",1700);w.next=now+2200+rand(w,3200)}}else{w.x+=dx/dist*step;w.y+=dy/dist*step}w.el.style.left=w.x+"px";w.el.style.bottom=w.y+"px"}
        else if(w.until&&now>=w.until){setState(w,"idle");w.next=now+650+rand(w,1500)}
        else if(!w.until&&now>=w.next&&!w.leaving){if(rand(w)<.72)moveTo(w,targetFor(w));else chooseAction(w,now)}
        if(!w.leaving&&Date.now()-w.last>TIMEOUT)leave(w)
      }
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame);
    function connect(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/live");ws.onopen=()=>document.getElementById("status").textContent="V2 PACK ONLINE";ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==="chat")spawn(d)}catch{}};ws.onclose=()=>{document.getElementById("status").textContent="RECONNECTING";setTimeout(connect,2200)}}
    connect();
    updateLeaderboard();
    if(new URLSearchParams(location.search).has("demo")){document.body.classList.add("demo");["LESTARWOLF","NightFang","CyberHowl","RedMoon","PackRunner"].forEach((username,i)=>setTimeout(()=>spawn({username,message:i===4?"!leaderboard":""}),i*850))}
    addEventListener("resize",()=>{for(const w of wolves.values())if(!w.leaving){w.x=clamp(w.x,-40,innerWidth-205);w.el.style.left=w.x+"px"}});
  </script>
</body>
</html>
